<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenLife AI - Starting Dispensary Suite...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 20px;
    }
    .splash-card {
      width: 520px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 28px;
      padding: 40px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 50px -10px rgba(16, 185, 129, 0.15);
      position: relative;
      text-align: center;
    }
    .glow-1 {
      position: absolute;
      top: -60px;
      left: -60px;
      width: 180px;
      height: 180px;
      background: rgba(16, 185, 129, 0.2);
      border-radius: 50%;
      filter: blur(50px);
      pointer-events: none;
    }
    .glow-2 {
      position: absolute;
      bottom: -60px;
      right: -60px;
      width: 180px;
      height: 180px;
      background: rgba(14, 165, 233, 0.2);
      border-radius: 50%;
      filter: blur(50px);
      pointer-events: none;
    }
    .brand-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #059669 0%, #10b981 50%, #06b6d4 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .brand-logo:hover {
      transform: scale(1.05);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    h1 span.ai {
      color: #34d399;
    }
    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(6, 78, 59, 0.6);
      color: #6ee7b7;
      border: 1px solid rgba(5, 150, 105, 0.5);
      margin-left: 6px;
      vertical-align: middle;
      cursor: pointer;
    }
    .progress-container {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 14px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }
    .progress-bar {
      height: 10px;
      width: 8%;
      background: linear-gradient(90deg, #059669 0%, #10b981 50%, #38bdf8 100%);
      border-radius: 10px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
    }
    .status-text {
      font-size: 12px;
      font-weight: 500;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 18px;
    }
    .spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid rgba(52, 211, 153, 0.3);
      border-radius: 50%;
      border-top-color: #34d399;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .pct {
      font-family: 'JetBrains Mono', monospace;
      color: #64748b;
      font-size: 11px;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 10px;
      color: #64748b;
      border-top: 1px solid rgba(51, 65, 85, 0.4);
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="brand-logo" id="logoBtn" title="GreenLife AI (Click 3x for Admin Console)">G+</div>
    
    <h1>GreenLife <span class="ai">AI</span> <span class="badge" id="badgeBtn">v2.4</span></h1>
    <p class="subtitle">Clinical Pharmacy & Dispensary Management Suite</p>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status-text">
      <div>
        <span class="spinner" id="spinner"></span>
        <span id="stageLabel">Connecting to local dispensary engine...</span>
      </div>
      <span class="pct" id="pctLabel">15%</span>
    </div>

    <div class="footer-note">
      <span>Zero Data Loss Production Architecture</span>
      <span id="portNote">Port 80 (Localhost)</span>
    </div>
  </div>

  <script>
    const stages = [
      { pct: 20, text: 'Verifying Docker background services...' },
      { pct: 40, text: 'Starting containerized database engine...' },
      { pct: 60, text: 'Initializing inventory & pricing cache...' },
      { pct: 85, text: 'Connecting to GreenLife AI backend...' },
      { pct: 95, text: 'Finalizing security session...' },
      { pct: 100, text: 'Dispensary ready! Launching portal...' }
    ];

    let currentStage = 0;
    const bar = document.getElementById('progressBar');
    const label = document.getElementById('stageLabel');
    const pct = document.getElementById('pctLabel');
    const spinner = document.getElementById('spinner');

    function updateProgress(p, text) {
      bar.style.width = p + '%';
      pct.textContent = p + '%';
      label.textContent = text;
    }

    // Step through initial boot animation
    const stageInterval = setInterval(() => {
      if (currentStage < stages.length) {
        updateProgress(stages[currentStage].pct, stages[currentStage].text);
        currentStage++;
      } else {
        clearInterval(stageInterval);
        checkHealthAndRedirect();
      }
    }, 450);

    function checkHealthAndRedirect() {
      // Poll backend health
      fetch('http://localhost/api/v1/health/')
        .then(res => {
          if (res.ok) {
            finishAndRedirect();
          } else {
            setTimeout(checkHealthAndRedirect, 1000);
          }
        })
        .catch(() => {
          // If fetch fails (CORS or starting), retry every 1.2s up to 20 attempts
          setTimeout(checkHealthAndRedirect, 1200);
        });
    }

    let redirected = false;
    function finishAndRedirect() {
      if (redirected) return;
      redirected = true;
      updateProgress(100, 'System Online! Opening Dispensary Portal...');
      spinner.style.display = 'none';
      setTimeout(() => {
        window.location.href = 'http://localhost';
      }, 600);
    }

    // Fallback: If 8 seconds pass, attempt to redirect anyway
    setTimeout(() => {
      finishAndRedirect();
    }, 8500);

    // Easter egg click counter for Super Admin
    let clickCount = 0;
    function registerAdminClick() {
      clickCount++;
      if (clickCount >= 3) {
        alert('Super Admin Directive:\n\nTo view live terminal telemetry, run Admin-Console.bat or hold the SHIFT key while launching GreenLife from the desktop shortcut.');
        clickCount = 0;
      }
    }
    document.getElementById('logoBtn').addEventListener('click', registerAdminClick);
    document.getElementById('badgeBtn').addEventListener('click', registerAdminClick);
  </script>
</body>
</html>
